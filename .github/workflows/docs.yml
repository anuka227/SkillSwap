name: Deploy API docs
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lint spec
        run: npx @redocly/cli lint openapi.yaml
      - name: Build docs
        run: |
          mkdir -p public/redoc public/swagger
          npx @redocly/cli build-docs openapi.yaml -o public/redoc/index.html
          cp openapi.yaml public/swagger/openapi.yaml
          cp swagger/index.html public/swagger/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4